    <!--
      THESIS: A month of household money is a ruled book, not a dashboard. It refuses the
      card grid, the donut and the green/red delta arrow; rank is carried by weight, case
      and rule, and the rule beneath an entry IS the gauge.
      OWN-WORLD: Pale ledger-green stock, warm near-black ink, oxblood column rules and
      correction marks, hairline horizontal rules, a double rule under every figure that
      closes. One variable grotesk (Archivo, self-hosted; the LAN has no internet) across
      weight 100-900 and width 62-125%. Colour is quarantined to rules and marks: the money
      column stays achromatic.
      STORY: Two people learn whether the household is on track this month, and what the
      book does not yet know. Blind spots print as entries, never as floating badges.
      FIRST VIEWPORT: Month and elapsed-days band; the month's spend at display scale over a
      double rule, with limit context beside it; three exception counts boxed to the right;
      then ruled category entries in LIMIT / EXPECTED TO DATE / ACTUAL columns.
      FORM: The Ruled Cash Book, candidate 1 of 7, chosen by the user over assigned
      candidate 7. Seed key 5b555ef5.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish
      review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
    -->

    <script type="module" src="/src/main.tsx"></script>
  </body>
